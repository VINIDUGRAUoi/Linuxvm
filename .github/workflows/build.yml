name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar projeto
        run: |
          mkdir -p app/src/main/java/com/example/linuxvm
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LinuxVM"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.linuxvm"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.linuxvm"
                  minSdk = 26
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += "arm64-v8a" }
              }
              packaging {
                  jniLibs { useLegacyPackaging = true }
              }
              lint { abortOnError = false }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Linux VM"
                  android:extractNativeLibs="true"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/linuxvm/MainActivity.kt <<'EOF'
          package com.example.linuxvm

          import android.app.Activity
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.graphics.Typeface
          import android.text.InputType
          import android.util.Log
          import android.view.inputmethod.EditorInfo
          import android.widget.*
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : Activity() {

              private val distros = listOf(
                  "Alpine 3.20" to "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz",
                  "Ubuntu 24.04" to "https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release/ubuntu-base-24.04.1-base-arm64.tar.gz",
                  "Outra (URL abaixo)" to ""
              )

              private val ui = Handler(Looper.getMainLooper())
              private lateinit var log: TextView
              private lateinit var scroll: ScrollView
              private lateinit var spinner: Spinner
              private lateinit var urlField: EditText
              private lateinit var input: EditText
              private var shell: Process? = null

              private val rootfs get() = File(filesDir, "rootfs")
              private val nativeDir get() = applicationInfo.nativeLibraryDir

              private fun showError(title: String, text: String) {
                  val t = TextView(this).apply {
                      this.text = "$title\n\n$text"
                      setTextIsSelectable(true)
                      textSize = 11f
                      setPadding(24, 24, 24, 24)
                  }
                  setContentView(ScrollView(this).apply { addView(t) })
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val crashFile = File(filesDir, "crash.txt")
                  Thread.setDefaultUncaughtExceptionHandler { _, e ->
                      try { crashFile.writeText(Log.getStackTraceString(e)) } catch (_: Exception) {}
                      android.os.Process.killProcess(android.os.Process.myPid())
                      System.exit(10)
                  }
                  if (crashFile.exists()) {
                      val old = crashFile.readText()
                      crashFile.delete()
                      showError("ERRO DA ULTIMA VEZ (tire um print):", old)
                      return
                  }
                  try {
                      buildUi()
                  } catch (e: Throwable) {
                      showError("ERRO AO ABRIR (tire um print):", Log.getStackTraceString(e))
                  }
              }

              private fun buildUi() {
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(24, 24, 24, 24) }

                  spinner = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, distros.map { it.first })
                  }
                  urlField = EditText(this).apply { hint = "URL de rootfs .tar.gz (opcional)"; setSingleLine() }
                  val buttons = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val installBtn = Button(this).apply { text = "Instalar"; setOnClickListener { install() } }
                  val startBtn = Button(this).apply { text = "Iniciar"; setOnClickListener { start() } }
                  val stopBtn = Button(this).apply { text = "Parar"; setOnClickListener { shell?.destroy(); print("\n[parado]\n") } }
                  buttons.addView(installBtn); buttons.addView(startBtn); buttons.addView(stopBtn)

                  log = TextView(this).apply { typeface = Typeface.MONOSPACE; textSize = 12f }
                  scroll = ScrollView(this).apply { addView(log) }
                  input = EditText(this).apply {
                      hint = "comando"; setSingleLine()
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS
                      imeOptions = EditorInfo.IME_ACTION_SEND
                      setOnEditorActionListener { _, _, _ -> send(); true }
                  }

                  root.addView(spinner); root.addView(urlField); root.addView(buttons)
                  root.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  root.addView(input)
                  setContentView(root)
                  print("ABI: ${android.os.Build.SUPPORTED_ABIS.joinToString()}\nToque em Instalar e depois em Iniciar.\n")
              }

              private fun print(s: String) {
                  ui.post {
                      log.append(s)
                      scroll.post { scroll.fullScroll(ScrollView.FOCUS_DOWN) }
                  }
              }

              private fun install() {
                  Thread {
                      try {
                          val url = urlField.text.toString().trim().ifEmpty { distros[spinner.selectedItemPosition].second }
                          if (url.isEmpty()) { print("Informe uma URL.\n"); return@Thread }
                          print("Baixando $url\n")
                          val tar = File(cacheDir, "rootfs.tar.gz")
                          val c = URL(url).openConnection() as HttpURLConnection
                          c.instanceFollowRedirects = true
                          c.inputStream.use { i -> tar.outputStream().use { o -> i.copyTo(o) } }
                          print("Extraindo...\n")
                          rootfs.deleteRecursively(); rootfs.mkdirs()
                          val p = ProcessBuilder("/system/bin/tar", "-xzf", tar.absolutePath, "-C", rootfs.absolutePath)
                              .redirectErrorStream(true).start()
                          p.inputStream.bufferedReader().forEachLine { print("tar: $it\n") }
                          p.waitFor()
                          File(rootfs, "etc").mkdirs()
                          File(rootfs, "etc/resolv.conf").apply { delete(); writeText("nameserver 8.8.8.8\nnameserver 1.1.1.1\n") }
                          tar.delete()
                          print("Pronto. Toque em Iniciar.\n")
                      } catch (e: Exception) { print("Erro: $e\n") }
                  }.start()
              }

              private fun start() {
                  if (!File(rootfs, "bin").exists()) { print("Instale um rootfs primeiro.\n"); return }
                  shell?.destroy()
                  val tmp = File(cacheDir, "proot").apply { mkdirs() }
                  val cmd = listOf(
                      "$nativeDir/libproot.so", "--link2symlink", "-0", "-r", rootfs.absolutePath,
                      "-b", "/dev", "-b", "/proc", "-b", "/sys", "-w", "/root",
                      "/usr/bin/env", "-i", "HOME=/root", "TERM=xterm-256color",
                      "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
                      "/bin/sh", "-i"
                  )
                  val pb = ProcessBuilder(cmd).redirectErrorStream(true)
                  pb.environment().apply {
                      put("PROOT_LOADER", "$nativeDir/libproot-loader.so")
                      put("PROOT_TMP_DIR", tmp.absolutePath)
                      put("LD_LIBRARY_PATH", nativeDir)
                  }
                  try {
                      val p = pb.start(); shell = p
                      print("[shell iniciado]\n")
                      Thread {
                          p.inputStream.bufferedReader().use { r ->
                              val buf = CharArray(2048); var n: Int
                              while (r.read(buf).also { n = it } > 0) print(String(buf, 0, n))
                          }
                          print("\n[shell encerrado]\n")
                      }.start()
                  } catch (e: Exception) { print("Erro ao iniciar: $e\n") }
              }

              private fun send() {
                  val s = input.text.toString(); input.setText("")
                  print("# $s\n")
                  Thread { try { shell?.outputStream?.apply { write((s + "\n").toByteArray()); flush() } } catch (_: Exception) {} }.start()
              }
          }
          EOF

      - name: Baixar proot (Termux) para jniLibs
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y patchelf
          BASE=https://packages.termux.dev/apt/termux-main
          curl -fsSL "$BASE/dists/stable/main/binary-aarch64/Packages" -o Packages
          getdeb() {
            awk -v p="$1" 'BEGIN{RS="";FS="\n"} $1=="Package: "p {for(i=1;i<=NF;i++) if($i ~ /^Filename: /){sub(/^Filename: /,"",$i); print $i}}' Packages
          }
          mkdir -p work
          for pkg in proot libtalloc; do
            f=$(getdeb $pkg | head -n1)
            [ -n "$f" ] || { echo "pacote $pkg nao encontrado"; exit 1; }
            curl -fsSL "$BASE/$f" -o "work/$pkg.deb"
            dpkg-deb -x "work/$pkg.deb" work/x
          done
          U=work/x/data/data/com.termux/files/usr
          J=app/src/main/jniLibs/arm64-v8a
          mkdir -p $J
          cp "$U/bin/proot" $J/libproot.so
          cp "$U/libexec/proot/loader" $J/libproot-loader.so
          cp -L "$U/lib/libtalloc.so.2" $J/libtalloc.so
          patchelf --replace-needed libtalloc.so.2 libtalloc.so $J/libproot.so
          ls -l $J

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - name: Conferir APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -n1)
          $BT/aapt dump badging "$APK" | grep -E "package:|launchable-activity|sdkVersion|targetSdk" || true
          unzip -l "$APK" | grep -E "classes.dex|libproot|libtalloc"
          unzip -p "$APK" classes.dex | grep -c "MainActivity" || true

      - uses: actions/upload-artifact@v4
        with:
          name: LinuxVM-debug-apk
          path: app/build/outputs/apk/debug/*.apk
